version: '3.5'

services:
  app:
    build: .
    container_name: warstation_app
    ports:
      - "443:443"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./certs:/etc/ssl/certs
    restart: always

  coredns:
    image: coredns/coredns:latest
    container_name: coredns
    volumes:
      - ./coredns-server/Corefile:/Corefile
      - ./coredns-server/zones:/zones
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:8080"   # Only listen on HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx  # Store logs outside container
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"