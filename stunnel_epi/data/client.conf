foreground = yes
debug = warning

[socks_client]
client = yes
accept = 9050
connect = warstation_app:443
verifyPeer = no
verify = 0
cert = /etc/stunnel/certs/fullchain.pem
key = /etc/stunnel/certs/privkey.pem
sslVersion = all

[socks_client_transparent]
client = yes
protocol = socks
accept = 9051
connect = warstation_app:443
verifyPeer = no
verify = 0
cert = /etc/stunnel/certs/fullchain.pem
key = /etc/stunnel/certs/privkey.pem
sslVersion = all
