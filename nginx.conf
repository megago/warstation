events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log debug;  # Enable detailed logging

    server {
        listen 5000 ssl http2;
        listen [::]:5000 ssl http2;
        server_name warstation.ru www.warstation.ru;

        # Secure SSL Configuration
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

#         ssl_session_cache shared:SSL:10m;
#         ssl_session_timeout 10m;
#
#         ssl_protocols TLSv1.2 TLSv1.3;
#         ssl_ciphers HIGH:!aNULL:!MD5;
#         ssl_prefer_server_ciphers on;

        # Block invalid methods like CONNECT
#         if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$) {
#             return 444;
#         }

        location / {
            proxy_pass https://warstation_app;  # Use localhost if the backend is on the same server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            access_log /var/log/nginx/access.log main;
            error_log /var/log/nginx/error.log debug;
        }
    }
}
